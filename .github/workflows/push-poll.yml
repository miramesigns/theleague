# Optional backup for Web Push poll.
# Primary scheduler: Vercel Pro cron in vercel.json (every 5 minutes → GET /api/push/poll).
# Schedule is disabled to avoid double-firing alongside Vercel; poll already dedupes sent IDs,
# but running both still wastes invocations. Re-enable the cron below only if Vercel cron is down.
# Secrets (for manual/backup runs): CRON_SECRET, APP_URL (e.g. https://theleague2026.vercel.app)

name: Push poll

on:
  # schedule:
  #   # Every 10 minutes — Hobby-era backup; leave commented while Vercel Pro cron is primary
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/push/poll
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL and CRON_SECRET secrets are required."
            exit 1
          fi
          base="${APP_URL%/}"
          curl -fsS -X POST "${base}/api/push/poll" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
